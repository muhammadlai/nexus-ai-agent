version: '3.8'

services:
  # --------------------------------------------------
  # 1. FastAPI Python Backend Service
  # --------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexus_backend
    restart: always
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-Nexus AI Agent}
      - VERSION=${VERSION:-1.0.0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-nexus_super_secret_jwt_key_2026}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/nexus-agent
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-nexus_secret_key_2026}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexus_network

  # --------------------------------------------------
  # 2. Frontend & Nginx Reverse Proxy Service
  # --------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nexus_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      n8n:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexus_network

  # --------------------------------------------------
  # 3. n8n Workflow & Automation Engine Service
  # --------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: nexus_n8n
    restart: always
    environment:
      - N8N_HOST=${SERVER_IP:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://${SERVER_IP:-localhost}/webhook/
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-nexus_n8n_password_2026}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-nexus_n8n_encryption_key_change_me}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nexus_network

networks:
  nexus_network:
    driver: bridge

volumes:
  n8n_data:
    driver: local
